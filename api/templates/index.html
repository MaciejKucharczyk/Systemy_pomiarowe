{% extends "base.html" %}

{% block head %}
    <script>
        function reload_image(){
            var image = document.getElementById('output');
            if(image) {
                var src = image.src;
                src = src.split('?')[0] + '?random=' + Math.random();
                image.setAttribute('src', src);
            }
        }
    </script>
{% endblock %}

{% block content %}
    <h1 class="text-center">Dostępne czujniki</h1>

    <div class="text-center">
        <table class="table table-bordered table-striped mt-4 align-middle">
            <thead class="table-light">
                <tr>
                    <th>ID / UUID</th>
                    <th>Nazwa</th>
                    <th>Typ</th>
                    <th>Status</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for row in data %}
                <tr>
                    <td>{{ row.uuid }}</td>
                    <td>{{ row.name }}</td>
                    <td>{{ row.type }}</td>
                    <td>
                        <span class="badge {{ 'bg-success' if row.is_online else 'bg-danger' }}">
                            {{ "Online" if row.is_online else "Offline" }}
                        </span>
                    </td>
                    <td>
                        <form action="{{ url_for('view_measurements', device_id=row.uuid) }}" method="GET">
                            <button type="submit" class="btn btn-outline-primary btn-sm mt-0">
                                Pomiary
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
    </div>

{% endblock %}
