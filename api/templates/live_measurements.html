{% extends "base.html" %}

{% block content %}
    <h2 class="text-center mb-3">Pomiary live</h2>

    {% if sensors | length > 0 %}
    <nav class="navbar navbar-light bg-light p-3 border border-light-subtle">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <form 
                action="{{ url_for('view_live_measurements') }}" 
                method="GET"
                class="d-flex gap-2 align-items-center"
            >

                <div class="d-flex align-items-center gap-2">
                    <label>Sensor</label>
                    <select class="form-select" aria-label="Wybierz limit" name="device_id">
                        {% for s in sensors %}
                        <option 
                            value="{{ s.uuid }}" 
                            {% if device_id == s.uuid %}selected{% endif %}
                        >{{ s.name }}</option>
                        {%endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-primary m-0">
                    Aktualizuj
                </button>
            </form>
        </div>
    </nav>

    <div class="bg-light p-3 border border-light-subtle w-100" style="height: 50vh">
        <canvas id="chart"></canvas>
    </div>

    <div class="text-center mt-4" style="overflow-y: overlay; max-height: 30vh;">
        <table class="table table-bordered table-striped">
            <thead class="table-light sticky-top">
                <tr>
                    <th>Seq</th>
                    <th>ID Grupy</th>
                    <th>Sensor</th>
                    <th>Wartość</th>
                    <th>Jednostka</th>
                    <th>Data zapisu</th>
                    <th>Data pomiaru</th>
                </tr>
            </thead>
            <tbody id="tableContent">
                
            </tbody>
        </table>
        
    </div>

    <input type="hidden" value="{{ device_id }}" id="deviceId" />
    {% else %}
        <p class="text-center">Brak sensorów</p>
    {% endif %}
{% endblock %}

{% block scripts %}
{% if sensors | length > 0 %}
<script>
    const deviceId = document.getElementById("deviceId").value;
    const source = new EventSource(`/stream/device/${deviceId}`);

    const ctx = document.getElementById("chart").getContext("2d");

    const chart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [{
                label: "Dane",
                data: [],
                borderColor: 'rgb(255, 99, 132)',
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                tension: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            plugins: {
                legend: {
                    position: 'top',
                }
            },
            scales: {
                x: {
                    type: 'time',
                    ticks: {
                        autoSkip: true,
                        maxTicksLimit: 10,
                    },
                    time: {
                        unit: 'second',
                        displayFormats: {
                            second: 'd-M-y HH:mm:ss'
                        },
                    },
                    title: {
                        display: true,          
                        text: 'Czas pomiaru',    
                        color: '#111',
                        font: {
                            size: 14,
                            weight: 'bold'
                        }
                    },
                    grid: {
                        display: true
                    },
                },
                y: {
                    title: {
                        display: true,
                        text: "Dane",
                        color: '#111',
                        font: {
                            size: 14,
                            weight: 'bold'
                        }
                    },
                    grid: {
                        color: '#e5e5e5'
                    },
                }
            }
        }
    });
    let labelConfigured = false;

    const table = $("#tableContent");
    const pushData = (data) => {
        chart.data.datasets[0].data.push({
            x: data.timestamp,
            y: data.value
        });

        if (chart.data.datasets[0].data.length > 20) {
            chart.data.datasets[0].data.shift(); 
        }

        if(!labelConfigured) {
            const label = data.sensor.charAt(0).toUpperCase() + data.sensor.slice(1);
            chart.data.datasets[0].label = `${label} (${data.unit})`;
            chart.options.scales.y.title.text = `${label} (${data.unit})`;
            labelConfigured = true;
        }
        chart.update();        

        const row = $("<tr></tr>");
        row.append(`<td>${data.seq}</td>`);
        row.append(`<td>${data.group_id}</td>`);
        row.append(`<td>${data.sensor}</td>`);
        row.append(`<td>${data.value}</td>`);
        row.append(`<td>${data.unit}</td>`);
        row.append(`<td>${data.ts_ms}</td>`);
        row.append(`<td>${data.received_at}</td>`);

        table.prepend(row);
    }

    source.onopen = (event) => {
        console.log("Connected");
    }

    source.onmessage = (event) => {
        const data = JSON.parse(event.data);

        pushData(data);
    }

    source.onerror = (event) => {
        console.log("Error");
    }

</script>
{% endif %}
{% endblock %}
